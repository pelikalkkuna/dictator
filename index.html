<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dictator — Ritimban Tasavalta</title>
<link rel="stylesheet" href="css/tyyli.css">
</head>
<body>
<main id="peli">
  <h1>Ritimban Tasavalta</h1>
  <p id="kuukausi-teksti"></p>

  <div id="kassaraportti" class="kassaraportti">
    <p id="kassa-teksti"></p>
  </div>

  <h2>Ryhmät</h2>
  <ul id="ryhmat-lista"></ul>

  <div id="audienssi" class="audienssi piilossa">
    <h2>Audienssi</h2>
    <p id="audienssi-teksti"></p>
    <p id="audienssi-swipe-vihje" class="swipe-vihje">← pyyhkäise hylätäksesi&nbsp;&nbsp;&nbsp;&nbsp;pyyhkäise hyväksyäksesi →</p>
    <div id="audienssi-napit">
      <button id="hyvaksy-nappi">Hyväksy</button>
      <button id="hylkaa-nappi">Hylkää</button>
    </div>
  </div>

  <div id="paatos" class="audienssi piilossa">
    <h2>Presidentin päätös</h2>
    <p>Yksi päätös per kuukausi. Rahalliset päätökset lukittuvat kassakriisissä.</p>
    <select id="paatos-valinta"></select>
    <div>
      <button id="paatos-toteuta-nappi">Toteuta</button>
      <button id="paatos-ohita-nappi">Ohita</button>
    </div>
  </div>

  <div id="uutinen" class="uutinen piilossa">
    <h2>Uutiset</h2>
    <p id="uutinen-teksti"></p>
  </div>

  <div id="attentaatti" class="kriisipaneeli piilossa">
    <h2>Attentaatti</h2>
    <p id="attentaatti-teksti"></p>
  </div>

  <div id="kriisi" class="kriisipaneeli piilossa">
    <h2 id="kriisi-otsikko"></h2>
    <p id="kriisi-teksti"></p>

    <div id="kriisi-uhka-napit" class="piilossa">
      <button id="kriisi-neuvottele-nappi">Neuvottele</button>
      <button id="kriisi-taistele-nappi">Taistele</button>
    </div>

    <div id="kriisi-vaatimus-napit" class="piilossa">
      <button id="kriisi-hyvaksy-nappi">Hyväksy</button>
      <button id="kriisi-hylkaa-nappi">Taistele</button>
    </div>

    <div id="kriisi-puolustus-osio" class="piilossa">
      <select id="kriisi-puolustus-valinta"></select>
      <div>
        <button id="kriisi-puolusta-nappi">Kutsu puolustamaan</button>
        <button id="kriisi-pakene-nappi">Pakene</button>
      </div>
    </div>

    <div id="kriisi-rangaistus-napit" class="piilossa">
      <button id="kriisi-rankaise-nappi">Rankaise</button>
      <button id="kriisi-armahda-nappi">Armahda</button>
    </div>
  </div>

  <div id="peli-ohi" class="peli-ohi piilossa">
    <h2>Peli päättyi</h2>
    <p id="peli-ohi-teksti"></p>
    <div id="peli-ohi-pisteet" class="piilossa">
      <p id="peli-ohi-titteli"></p>
      <ul id="peli-ohi-pisteet-lista"></ul>
    </div>
  </div>

  <button id="seuraava-kuukausi-nappi">Seuraava kuukausi</button>
</main>

<script src="js/pelitila.js"></script>
<script src="js/moottori/mittarit.js"></script>
<script src="js/moottori/talous.js"></script>
<script src="js/data/audienssit.js"></script>
<script src="js/moottori/audienssit.js"></script>
<script src="js/data/paatokset.js"></script>
<script src="js/moottori/paatokset.js"></script>
<script src="js/data/uutiset.js"></script>
<script src="js/moottori/uutiset.js"></script>
<script src="js/moottori/sota.js"></script>
<script src="js/data/kriisikortit.js"></script>
<script src="js/moottori/kriisi.js"></script>
<script src="js/moottori/attentaatti.js"></script>
<script src="js/moottori/pako.js"></script>
<script src="js/moottori/pisteytys.js"></script>
<script src="js/nakyma/piirto.js"></script>
<script src="js/paa.js"></script>
</body>
</html>
